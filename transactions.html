<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions | BudgetBuddy</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
      /* pre-paint theme: avoids dark/light flash, global dark mode */
      try{(function(){var s={theme:"system"};try{s=Object.assign(s,JSON.parse(localStorage.getItem("bb_settings"))||{})}catch(e){}var t=s.theme;if(t==="system"){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)})()}catch(e){}
    </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" title="Show / hide sidebar">☰</button>
      <div>
        <h2>Transactions</h2>
        <div class="sub">Add, search and filter</div>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <h3>Add new transaction</h3>
        <p class="hint">Date defaults to today — change it for past entries.</p>
        <form id="transactionForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
          <input type="text" id="description" placeholder="Description" required>
          <input type="number" id="amount" placeholder="Amount" step="0.01" min="0" required>
          <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="category" data-cats aria-label="Category"></select>
          <input type="date" id="date" title="Transaction date">
          <button type="submit" class="btn">Add Transaction</button>
        </form>
      </div>

      <div class="panel">
        <h3>All transactions</h3>
        <p class="hint" id="filterHint"></p>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <div class="seg" id="viewSeg" role="tablist" aria-label="Change view">
            <button data-view="list" title="List view">☰ List</button>
            <button data-view="grid" title="Card grid view">▦ Grid</button>
            <button data-view="table" title="Compact table view">▤ Table</button>
            <button data-view="days" title="Grouped by day view">🗓 Days</button>
          </div>
          <span class="pill" id="viewCount"></span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px">
          <input type="text" id="search" placeholder="Search description..." style="flex:1;min-width:160px">
          <select id="filterType">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filterCategory" data-cats="all" aria-label="Filter by category"></select>
          <input type="month" id="filterMonth" title="Filter by month">
          <button id="clearFilters" class="btn-ghost">Clear</button>
        </div>
      </div>

      <div id="transactionList" style="display:grid;gap:10px"></div>
    </div>

    <footer>© 2025 BudgetBuddy</footer>
  </div>
</div>

<script src="js/monthly.js"></script>
<script src="js/layout.js"></script>
<script type="module" src="js/transactions.js"></script>
</body>
</html>
