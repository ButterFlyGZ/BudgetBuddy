<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History | BudgetBuddy</title>
  <script>
      /* pre-paint theme: avoids dark/light flash, global dark mode */
      try{(function(){var s={theme:"system"};try{s=Object.assign(s,JSON.parse(localStorage.getItem("bb_settings"))||{})}catch(e){}var t=s.theme;if(t==="system"){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)})()}catch(e){}
    </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" title="Show / hide sidebar">☰</button>
      <div>
        <h2>Transaction History</h2>
        <div class="sub">Full list</div>
      </div>
    </div>

    <div class="content">
      <div class="panel" style="overflow-x:auto">
        <table id="historyTable" style="width:100%;border-collapse:collapse;font-size:14px">
          <thead>
            <tr style="text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em">
              <th style="padding:10px">Date</th>
              <th style="padding:10px">Title</th>
              <th style="padding:10px">Type</th>
              <th style="padding:10px">Amount</th>
              <th style="padding:10px">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <footer>© 2025 BudgetBuddy</footer>
  </div>
</div>

<script src="js/monthly.js"></script>
<script src="js/layout.js"></script>
<script>
  const tableBody = document.querySelector("#historyTable tbody");
  const transactions = JSON.parse(localStorage.getItem("transactions")) || [];

  function renderHistory() {
    tableBody.innerHTML = "";
    [...transactions].sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))).forEach((t) => {
      const row = document.createElement("tr");
      row.style.borderTop = "1px solid var(--line)";
      row.innerHTML = `
        <td style="padding:10px">${t.date || "–"}</td>
        <td style="padding:10px">${t.title || t.description || "–"}</td>
        <td style="padding:10px">${t.type}</td>
        <td style="padding:10px">${(window.BudgetBuddy ? window.BudgetBuddy.money(t.amount) : "$" + Number(t.amount).toFixed(2))}</td>
        <td style="padding:10px"><button onclick="deleteTransaction(${t.id})" class="btn-ghost">🗑️</button></td>
      `;
      tableBody.appendChild(row);
    });
    if (!transactions.length) tableBody.innerHTML = `<tr><td colspan="5" style="padding:16px;text-align:center;color:var(--muted)">No transactions yet.</td></tr>`;
  }

  function deleteTransaction(id) {
    const updated = transactions.filter(t => t.id !== id);
    localStorage.setItem("transactions", JSON.stringify(updated));
    location.reload();
  }

  renderHistory();
</script>
</body>
</html>
